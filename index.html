<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHISTLE FC STAT</title>
  <link rel="icon" type="image/svg+xml" href="./whistle_logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app"></div>

<!-- 화면 템플릿 (Claude Design "Whistle STAT.dc.html" 이식본).
     {{ 경로 }} = script.js renderVals() 값 바인딩 / <sc-for> 반복 / <sc-if> 조건 / on* = 이벤트 핸들러 -->
<template id="dc-template">
<div style="min-height:100vh; background:#F6F5F1; padding-bottom:110px;">

  <div data-screen-label="헤더" style="position:sticky; top:0; z-index:100; background:#113C98; box-shadow:0 2px 12px rgba(17,30,60,.18);">
    <div style="max-width:960px; margin:0 auto; padding:{{ ui.headPad }};">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <div class="brand" onClick="{{ onLogo }}" style="flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:6px 10px 6px 0; margin:-6px 0; cursor:pointer;">
          <img src="whistle_logo.svg" alt="WHISTLE" style="width:{{ ui.logo }}; height:{{ ui.logo }}; border-radius:10px; border:2px solid #F0D281; display:block;">
          <div style="min-width:0;">
            <div style="font-family:'Oswald','Pretendard'; font-size:{{ ui.title }}; font-weight:700; color:#FFFFFF; letter-spacing:2px;">WHISTLE FC</div>
            <div style="font-size:12px; color:#9FB4E4; letter-spacing:.5px;">휘슬의 축구 발자취</div>
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select value="{{ season }}" onChange="{{ onSeason }}" style="background:#F0D281; color:#113C98; font-size:13px; font-weight:800; padding:7px 12px; border-radius:18px; border:none; cursor:pointer; font-family:'Pretendard'; outline:none;">
            <option value="2026">2026 시즌</option><option value="2025">2025 시즌</option><option value="2024">2024 시즌</option><option value="2023">2023 시즌</option><option value="2022">2022 시즌</option><option value="2021">2021 시즌</option><option value="2020">2020 시즌</option><option value="2019">2019 시즌</option><option value="2018">2018 시즌</option><option value="2017">2017 시즌</option><option value="2016">2016 시즌</option><option value="2015">2015 시즌</option><option value="2014">2014 시즌</option><option value="2013">2013 시즌</option><option value="2012">2012 시즌</option><option value="2011">2011 시즌</option><option value="2010">2010 시즌</option><option value="2009">2009 시즌</option><option value="2008">2008 시즌</option><option value="2007">2007 시즌</option><option value="2006">2006 시즌</option><option value="2005">2005 시즌</option><option value="2004">2004 시즌</option><option value="2003">2003 시즌</option><option value="2002">2002 시즌</option><option value="2001">2001 시즌</option><option value="2000">2000 시즌</option>
          </select>
          <div onClick="{{ onAllTime }}" style="border:1.5px solid {{ allBtnBd }}; background:{{ allBtnBg }}; color:{{ allBtnColor }}; font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:18px; cursor:pointer;">{{ allBtnLabel }}</div>
        </div>
      </div>
      <div style="display:{{ ui.topTabs }}; gap:4px; margin-top:14px;">
        <sc-for list="{{ tabsTop }}" as="t" hint-placeholder-count="5">
          <div onClick="{{ t.onClick }}" style="flex:1; text-align:center; padding:10px 0; cursor:pointer; font-size:13px; font-weight:700; color:{{ t.color }}; background:{{ t.bg }}; border-radius:10px 10px 0 0;">{{ t.label }}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width:960px; margin:0 auto; padding:{{ ui.mainPad }};">

    <sc-if value="{{ hasStatus }}" hint-placeholder-val="{{ false }}">
      <div style="background:#EEF2FB; color:#113C98; font-size:12.5px; font-weight:600; text-align:center; padding:8px; border-radius:10px; margin-bottom:14px;">{{ statusMsg }}</div>
    </sc-if>

    <sc-if value="{{ vNorwich }}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFEC3D; border-radius:14px; padding:18px 20px; margin-bottom:18px; box-shadow:0 3px 12px rgba(90,80,0,.18);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <div>
            <div style="font-size:10.5px; font-weight:800; color:#00713C; letter-spacing:1.5px;">HIDDEN CANARY MODE</div>
            <div style="font-family:'Oswald','Pretendard'; font-size:19px; font-weight:700; color:#00522B; margin-top:2px;">NORWICH CITY FC! "OTBC"</div>
            <div style="font-size:11.5px; color:#4A6B1E; margin-top:2px;">{{ norLeague }}</div>
          </div>
          <div onClick="{{ onNorClose }}" style="width:26px; height:26px; border-radius:50%; background:#00A650; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; cursor:pointer;">×</div>
        </div>
        <div style="font-size:12px; color:#4A6B1E;">{{ norStatus }}</div>
        <div class="g-nor">
          <div style="background:#FFFFFF; border-radius:10px; overflow:hidden;">
            <div style="font-size:11px; font-weight:800; color:#00713C; padding:9px 14px; background:#E9F7EE;">리그 순위</div>
            <sc-for list="{{ norRows }}" as="r" hint-placeholder-count="5">
              <div style="display:grid; grid-template-columns:32px 1fr 44px 44px; align-items:center; padding:8px 14px; font-size:12.5px; background:{{ r.bg }}; color:{{ r.fg }}; font-weight:{{ r.weight }}; border-top:1px solid #F0F0E6;">
                <span>{{ r.rank }}</span><span>{{ r.team }}</span><span>{{ r.played }}경기</span><span>{{ r.pts }}점</span>
              </div>
            </sc-for>
          </div>
          <div style="background:#FFFFFF; border-radius:10px; overflow:hidden;">
            <div style="font-size:11px; font-weight:800; color:#00713C; padding:9px 14px; background:#E9F7EE;">최근 5경기</div>
            <sc-for list="{{ norLast }}" as="e" hint-placeholder-count="5">
              <div style="display:grid; grid-template-columns:44px 1fr auto 24px; align-items:center; gap:8px; padding:8px 14px; font-size:12px; border-top:1px solid #F0F0E6;">
                <span style="color:#8A8577;">{{ e.date }}</span>
                <span style="font-weight:700;">{{ e.opp }} <span style="font-weight:600; color:#B0AB9D;">({{ e.ha }})</span></span>
                <span style="font-family:'Oswald','Pretendard'; font-weight:600;">{{ e.score }}</span>
                <span style="width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; background:{{ e.resBg }}; color:{{ e.resColor }};">{{ e.resLabel }}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="font-size:11px; color:#00713C; font-weight:700; margin-top:10px; text-align:right;">On The Ball, City!</div>
      </div>
    </sc-if>

    <sc-if value="{{ vHome }}" hint-placeholder-val="{{ true }}">
      <div data-screen-label="Home" style="display:flex; flex-direction:column;">

        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">다가오는 경기</div>

        <sc-if value="{{ noNext }}" hint-placeholder-val="{{ false }}">
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:22px 18px; text-align:center;">
            <div style="font-size:14px; font-weight:800;">등록된 다음 경기가 없습니다</div>
            <div style="font-size:12.5px; color:#6B675C; margin-top:4px;">일정이 등록되면 여기에서 참석 투표를 할 수 있어요.</div>
          </div>
        </sc-if>

        <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
          <div style="background:#113C98; border-radius:14px; overflow:hidden; box-shadow:0 3px 12px rgba(17,30,60,.18);">
            <div style="padding:{{ ui.heroPad }}; display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px;">
              <div style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;">
                <div style="background:#F0D281; color:#113C98; font-family:'Oswald','Pretendard'; font-size:13px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:8px;">{{ next.dday }}</div>
                <div style="font-family:'Oswald','Pretendard'; font-size:44px; font-weight:700; color:#F0D281; line-height:1;">{{ next.dateShort }}</div>
                <div style="font-size:13px; color:#9FB4E4;">{{ next.when }}</div>
              </div>
              <div style="flex:1; min-width:150px;">
                <div style="font-size:12px; font-weight:800; color:#F0D281; letter-spacing:1.5px;">WHISTLE LEAGUE</div>
                <div style="font-size:22px; font-weight:800; color:#FFFFFF; margin-top:4px;">vs {{ next.opponent }}</div>
                <div style="font-size:12.5px; color:#CBD8F5; margin-top:8px;">{{ next.venue }}</div>
                <sc-if value="{{ next.hasMap }}" hint-placeholder-val="{{ true }}">
                  <div style="font-size:12.5px; color:#9FB4E4; margin-top:2px;">{{ next.addressDot }}<a href="{{ next.mapUrl }}" target="_blank" rel="noopener" style="color:#F0D281; font-weight:700;">지도 보기</a></div>
                </sc-if>
                <sc-if value="{{ next.note }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:12.5px; color:#9FB4E4; margin-top:6px;">{{ next.note }}</div>
                </sc-if>
              </div>
              <sc-if value="{{ next.hasMap }}" hint-placeholder-val="{{ true }}">
                <div id="venueMap" class="venue-map" data-address="{{ next.address }}" data-name="{{ next.name }}"></div>
              </sc-if>
            </div>
            <sc-if value="{{ rsvpOn }}" hint-placeholder-val="{{ true }}">
              <div style="background:#FFFFFF; padding:{{ ui.cardPad }};">
                <sc-if value="{{ noIdentity }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:200px;">
                      <div style="font-size:15px; font-weight:800;">내 참석 여부</div>
                      <div style="font-size:12.5px; color:#6B675C; margin-top:3px;">처음 한 번만 명단에서 내 이름을 골라주세요. 이 기기에 저장돼요.</div>
                    </div>
                    <div onClick="{{ openPicker }}" style="min-height:48px; padding:0 22px; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-size:14.5px; font-weight:800; background:#113C98; color:#FFFFFF;">내 이름 선택하기</div>
                  </div>
                </sc-if>
                <sc-if value="{{ hasIdentity }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
                    <span style="font-size:15px; font-weight:800;">{{ myName }}님 참석 여부 <span onClick="{{ openPicker }}" style="font-size:12.5px; font-weight:700; color:#113C98; margin-left:6px; cursor:pointer;">본인 변경</span></span>
                    <span style="font-size:12.5px; color:#6B675C;">경기 당일까지 변경 가능</span>
                  </div>
                  <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px;">
                    <sc-for list="{{ rsvpButtons }}" as="b" hint-placeholder-count="3">
                      <div onClick="{{ b.onClick }}" style="min-height:48px; display:flex; align-items:center; justify-content:center; gap:7px; border-radius:12px; cursor:pointer; font-size:14.5px; font-weight:800; background:{{ b.bg }}; color:{{ b.color }}; border:1.5px solid {{ b.bd }}; transition:background .15s, color .15s;">
                        <span style="width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; background:{{ b.dotBg }}; color:{{ b.dotFg }};">{{ b.mark }}</span>{{ b.label }}
                      </div>
                    </sc-for>
                  </div>
                  <div style="font-size:12.5px; color:{{ myNoteColor }}; margin-top:10px; font-weight:600;">{{ myNote }}</div>
                  <sc-if value="{{ isManager }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid #F0EEE7;">
                      <div style="flex:1; min-width:180px;">
                        <div style="font-size:15px; font-weight:800;">용병 추가</div>
                        <div style="font-size:12.5px; color:#6B675C; margin-top:3px;">내가 데려오는 용병 인원이에요. 참석 인원에 합산돼요.</div>
                      </div>
                      <div style="display:flex; align-items:center; gap:10px;">
                        <div onClick="{{ guestMinus }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#113C98; cursor:pointer;">&minus;</div>
                        <div style="min-width:30px; text-align:center; font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98;">{{ myGuests }}</div>
                        <div onClick="{{ guestPlus }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #113C98; background:#113C98; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#FFFFFF; cursor:pointer;">+</div>
                      </div>
                    </div>
                  </sc-if>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ rsvpOn }}" hint-placeholder-val="{{ true }}">
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:{{ ui.cardPad }}; margin-top:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:15px; font-weight:800;">실시간 참석 현황</span>
                <span style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:800; color:#15803D; background:#E4F5EA; padding:3px 8px; border-radius:8px; letter-spacing:.5px;"><span class="live-dot"></span>LIVE</span>
              </div>
              <span style="font-size:12.5px; color:#6B675C;">{{ lastUpdate }}</span>
            </div>

            <div style="display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-top:14px;">
              <div style="display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;">
                <span style="font-family:'Oswald','Pretendard'; font-size:44px; font-weight:700; color:#113C98; line-height:1;">{{ cnt.head }}</span>
                <span style="font-size:14px; font-weight:800; color:#113C98;">명 참석</span>
                <span style="font-size:13px; color:#8A8577;">{{ cnt.sub }}</span>
              </div>
              <div style="margin-left:auto; font-size:13px; font-weight:800; padding:5px 11px; border-radius:10px; background:{{ quorum.bg }}; color:{{ quorum.fg }};">{{ quorum.label }}</div>
            </div>

            <div style="position:relative; margin-top:12px;">
              <div style="display:flex; height:14px; border-radius:7px; overflow:hidden; background:#F3F1EA;">
                <div style="width:{{ bar.attend }}; background:#2E7D4F; transition:width .4s;"></div>
                <div style="width:{{ bar.guests }}; background:#3A66C9; transition:width .4s;"></div>
                <div style="width:{{ bar.maybe }}; background:#E0B94B; transition:width .4s;"></div>
                <div style="width:{{ bar.absent }}; background:#C0392B; transition:width .4s;"></div>
              </div>
              <div style="position:absolute; top:-4px; bottom:-4px; left:{{ bar.minPos }}; width:2px; background:#113C98; border-radius:1px;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:9px; font-size:13px; color:#6B675C;">
              <div style="display:flex; gap:14px; flex-wrap:wrap;">
                <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#2E7D4F; display:inline-block;"></span>참석 {{ cnt.attend }}</span>
                <sc-if value="{{ cnt.guests }}" hint-placeholder-val="{{ false }}">
                  <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#3A66C9; display:inline-block;"></span>용병 {{ cnt.guests }}</span>
                </sc-if>
                <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#E0B94B; display:inline-block;"></span>미정 {{ cnt.maybe }}</span>
                <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#C0392B; display:inline-block;"></span>불참 {{ cnt.absent }}</span>
                <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#F3F1EA; border:1px solid #E7E4DB; display:inline-block;"></span>미응답 {{ cnt.none }}</span>
              </div>
              <span style="color:#113C98; font-weight:700;">| 최소 {{ minPlayers }}명</span>
            </div>

            <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid #F0EEE7;">
              <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
                <div style="display:grid; grid-template-columns:{{ ui.groupCols }}; gap:{{ ui.groupGap }}; align-items:start;">
                  <span style="font-size:12px; font-weight:800; color:{{ g.color }}; padding-top:4px;">{{ g.label }} {{ g.n }}</span>
                  <div style="display:flex; flex-wrap:wrap; gap:5px;">
                    <sc-for list="{{ g.names }}" as="p" hint-placeholder-count="6">
                      <span style="font-size:13.5px; padding:5px 12px; border-radius:10px; background:{{ p.bg }}; color:{{ p.fg }}; font-weight:{{ p.weight }}; border:1px solid {{ p.bd }};">{{ p.name }}</span>
                    </sc-for>
                    <sc-if value="{{ g.empty }}" hint-placeholder-val="{{ false }}">
                      <span style="font-size:13px; color:#8A8577; padding:3px 0;">없음</span>
                    </sc-if>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">시즌 기록</div>

        <div class="hero" style="background:#113C98; border-radius:14px; padding:20px 24px; display:flex; flex-wrap:wrap; align-items:center; gap:16px 20px;">
          <div style="font-family:'Oswald','Pretendard'; font-size:44px; font-weight:700; color:#F0D281; line-height:1;">{{ season }}</div>
          <div style="flex:1; min-width:180px;">
            <div style="font-size:15px; font-weight:800; color:#FFFFFF;">{{ stRecord }}</div>
            <div style="font-size:13px; color:#9FB4E4; margin-top:3px;">승률 {{ stRate }}% · 득점 {{ stGoals }} · 실점 {{ stGa }}</div>
            <div style="font-size:13px; color:#F0D281; margin-top:3px; font-weight:700;">시즌 MVP {{ mvpName }} · {{ mvpSub }}</div>
          </div>
          <div style="display:flex; gap:5px; align-items:center;">
            <sc-for list="{{ formList }}" as="f" hint-placeholder-count="5">
              <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; background:{{ f.bg }}; color:{{ f.fg }};">{{ f.label }}</div>
            </sc-for>
            <div style="font-size:12px; color:#9FB4E4; margin-left:5px;">최근 5경기</div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:10px;">
          <sc-for list="{{ seasonCards }}" as="c" hint-placeholder-count="4">
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-top:3px solid {{ c.accent }}; border-radius:14px; padding:14px 12px; text-align:center;">
              <div style="font-size:12px; font-weight:700; color:#6B675C;">{{ c.title }}</div>
              <div style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98; margin:6px 0 3px;">{{ c.value }}</div>
              <div style="font-size:12px; color:#8A8577;">{{ c.sub }}</div>
            </div>
          </sc-for>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:10px;">
          <sc-for list="{{ seasonBest }}" as="b" hint-placeholder-count="3">
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;">
              <div style="width:36px; height:36px; border-radius:50%; background:#FAF3DC; border:1.5px solid #F0D281; display:flex; align-items:center; justify-content:center; font-family:'Oswald','Pretendard'; font-size:15px; font-weight:700; color:#A5841B;">{{ b.icon }}</div>
              <div>
                <div style="font-size:12px; font-weight:700; color:#6B675C;">{{ b.title }}</div>
                <div style="font-size:15px; font-weight:800; margin-top:2px;">{{ b.name }} <span style="font-size:13px; font-weight:700; color:#A5841B;">{{ b.sub }}</span></div>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 10px;">

        <div style="display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;">
          <sc-for list="{{ regionalChips }}" as="ch" hint-placeholder-count="4">
            <div onClick="{{ ch.onClick }}" style="background:{{ ch.bg }}; border:1px solid {{ ch.bd }}; color:{{ ch.color }}; font-size:12px; font-weight:700; padding:6px 14px; border-radius:16px; cursor:pointer;">{{ ch.label }}</div>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden; margin-bottom:12px; max-height:420px; overflow-y:auto;">
          <div style="display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr; padding:10px 16px; background:#F6F5F1; position:sticky; top:0; z-index:1;">
            <span style="font-size:11px; font-weight:800; color:#8A8577;">지역</span><span style="font-size:11px; font-weight:800; color:#8A8577;">경기수</span><span style="font-size:11px; font-weight:800; color:#8A8577;">승</span><span style="font-size:11px; font-weight:800; color:#8A8577;">무</span><span style="font-size:11px; font-weight:800; color:#8A8577;">패</span><span style="font-size:11px; font-weight:800; color:#8A8577;">승률</span>
          </div>
          <sc-for list="{{ regionalGroups }}" as="g" hint-placeholder-count="3">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:{{ g.bg }}; border-top:1px solid #E7E4DB; border-left:4px solid {{ g.color }};">
              <span style="font-size:12px; font-weight:800; color:{{ g.color }};">{{ g.name }}</span>
              <span style="font-size:11px; font-weight:600; color:{{ g.color }}; opacity:.75;">{{ g.summary }}</span>
            </div>
            <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="6">
              <div style="display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr; padding:9px 16px; border-top:1px solid #F0EEE7; font-size:13px;">
                <span style="font-weight:700; color:{{ g.color }};">{{ r.region }}</span><span>{{ r.matches }}</span><span>{{ r.wins }}</span><span>{{ r.draws }}</span><span>{{ r.losses }}</span><span style="font-weight:700; color:{{ r.rateColor }};">{{ r.winRate }}%</span>
              </div>
            </sc-for>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
            <div style="font-size:13.5px; font-weight:800;">지역별 승률 히트맵</div>
            <div style="display:flex; gap:12px; font-size:11px; color:#8A8577;">
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:#CDEBD8; display:inline-block;"></span>60% 이상</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:#F6ECC8; display:inline-block;"></span>40–60%</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:#F6D5D5; display:inline-block;"></span>40% 미만</span>
            </div>
          </div>
          <sc-for list="{{ regionalGroups }}" as="g" hint-placeholder-count="3">
            <div style="font-size:11.5px; font-weight:800; color:{{ g.color }}; margin:14px 0 6px; letter-spacing:.3px;">{{ g.name }} <span style="font-weight:600; color:#B0AB9D;">{{ g.count }}</span></div>
            <sc-if value="{{ g.isSeoul }}" hint-placeholder-val="{{ false }}">
              <div class="seoul-map">
                <div style="display:flex; align-items:center; gap:14px; background:{{ g.sel.bg }}; border-radius:12px; padding:12px 16px; margin-bottom:8px; visibility:{{ g.selVis }};">
                  <div style="font-family:'Oswald','Pretendard'; font-size:38px; font-weight:700; line-height:1; color:{{ g.sel.fg }}; font-variant-numeric:tabular-nums; min-width:112px;">{{ g.sel.winRate }}%</div>
                  <div style="flex:1; min-width:0;">
                    <div style="font-size:16px; font-weight:800; color:{{ g.sel.fg }};">{{ g.sel.gu }}</div>
                    <div style="font-size:12px; color:{{ g.sel.fg }}; opacity:.85; margin-top:2px;">{{ g.sel.matches }}경기 · {{ g.sel.record }} · 승률 {{ g.sel.rank }}위/{{ g.sel.total }}</div>
                  </div>
                </div>
                <svg viewBox="0 0 400 340" role="img" aria-label="서울 자치구별 승률 지도">
                  <rect x="0" y="0" width="400" height="340" fill="transparent" onClick="{{ g.onMapBlank }}"></rect>
                  <sc-for list="{{ g.mapCells }}" as="d" hint-placeholder-count="25">
                    <path d="{{ d.path }}" fill="{{ d.fill }}" stroke="{{ d.stroke }}" stroke-width="{{ d.strokeWidth }}" stroke-linejoin="round" onMouseEnter="{{ d.onPick }}" onClick="{{ d.onPick }}"><title>{{ d.tip }}</title></path>
                  </sc-for>
                  <sc-for list="{{ g.mapCells }}" as="d" hint-placeholder-count="25">
                    <text x="{{ d.cx }}" y="{{ d.cy }}" text-anchor="middle" font-size="9.5" font-weight="800" fill="{{ d.labelColor }}" style="pointer-events:none;">{{ d.label }}</text>
                    <text x="{{ d.cx }}" y="{{ d.cy2 }}" text-anchor="middle" font-size="8.5" font-weight="600" fill="{{ d.labelColor }}" style="pointer-events:none;">{{ d.sub }}</text>
                  </sc-for>
                </svg>
              </div>
            </sc-if>
            <sc-if value="{{ g.notSeoul }}" hint-placeholder-val="{{ true }}">
            <div class="g-heat">
              <sc-for list="{{ g.heat }}" as="c" hint-placeholder-count="6">
                <div style="background:{{ c.bg }}; border-radius:8px; padding:8px 10px; min-width:0;">
                  <div style="font-size:12px; font-weight:800; color:{{ c.fg }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ c.region }}</div>
                  <div style="font-size:11px; color:{{ c.fg }}; margin-top:2px; font-variant-numeric:tabular-nums;">{{ c.winRate }}% · {{ c.matches }}경기</div>
                </div>
              </sc-for>
            </div>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-if>

  </div>

  <sc-if value="{{ pickerOpen }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="이름 선택" onClick="{{ closePicker }}" style="position:fixed; inset:0; z-index:200; background:rgba(17,30,60,.45); display:flex; align-items:flex-end; justify-content:center;">
      <div onClick="{{ stop }}" style="width:100%; max-width:560px; max-height:82vh; background:#FFFFFF; border-radius:18px 18px 0 0; display:flex; flex-direction:column; box-shadow:0 -6px 24px rgba(17,30,60,.2);">
        <div style="padding:18px 20px 12px; border-bottom:1px solid #F0EEE7;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:16px; font-weight:800;">내 이름 선택</div>
            <div onClick="{{ closePicker }}" style="width:30px; height:30px; border-radius:50%; background:#F3F1EA; color:#6B675C; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; cursor:pointer;">&times;</div>
          </div>
          <div style="font-size:12.5px; color:#6B675C; margin-top:4px;">선택한 이름은 이 기기에 저장돼요. 다른 사람 이름은 고르지 말아주세요.</div>
          <input onInput="{{ onQuery }}" placeholder="이름 검색 · 목록에 없으면 여기서 찾으세요" style="width:100%; margin-top:12px; padding:11px 14px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-family:'Pretendard'; font-size:14px; outline:none;">
        </div>
        <div style="overflow-y:auto; padding:14px 20px 20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px;">
          <sc-for list="{{ pickList }}" as="p" hint-placeholder-count="12">
            <div data-pick="{{ p.key }}" data-core="{{ p.core }}" onClick="{{ p.onClick }}" style="min-height:48px; display:{{ p.disp }}; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-size:14px; font-weight:700; background:{{ p.bg }}; color:{{ p.fg }}; border:1.5px solid {{ p.bd }};">{{ p.name }}</div>
          </sc-for>
          <div id="pickEmpty" style="display:none; grid-column:1 / -1; text-align:center; font-size:12.5px; color:#8A8577; padding:20px 0;">등록되지 않은 이름이에요. 운영진에게 선수 등록을 요청해주세요.</div>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="position:fixed; bottom:0; left:0; right:0; z-index:100; background:#FFFFFF; border-top:1px solid #E7E4DB; box-shadow:0 -2px 10px rgba(17,30,60,.08);">
    <div style="max-width:960px; margin:0 auto; display:flex;">
      <sc-for list="{{ tabsBottom }}" as="t" hint-placeholder-count="5">
        <div onClick="{{ t.onClick }}" style="flex:1; text-align:center; padding:12px 4px calc(13px + env(safe-area-inset-bottom)); cursor:pointer; font-size:13px; font-weight:700; color:{{ t.color }}; border-top:3px solid {{ t.bd }};">{{ t.label }}</div>
      </sc-for>
    </div>
  </div>

</div>
</template>

<script src="./seoul_districts.js" defer></script>
<script src="./script.js" defer></script>
</body>
</html>
