<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHISTLE FC STAT</title>
  <link rel="icon" type="image/svg+xml" href="./whistle_logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app"></div>

<!-- 화면 템플릿 (Claude Design "Whistle STAT.dc.html" 이식본).
     {{ 경로 }} = script.js renderVals() 값 바인딩 / <sc-for> 반복 / <sc-if> 조건 / on* = 이벤트 핸들러 -->
<template id="dc-template">
<div style="min-height:100vh; background:#F6F5F1; padding-bottom:96px;">

  <div data-screen-label="헤더" style="position:sticky; top:0; z-index:100; background:#113C98; box-shadow:0 2px 12px rgba(17,30,60,.18);">
    <div style="max-width:960px; margin:0 auto; padding:16px 20px 0;">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <div class="brand" onClick="{{ onLogo }}" style="flex:1; min-width:200px; display:flex; align-items:center; gap:12px; padding:6px 10px 6px 0; margin:-6px 0; cursor:pointer;">
          <img src="whistle_logo.svg" alt="WHISTLE" style="width:44px; height:44px; border-radius:10px; border:2px solid #F0D281; display:block;">
          <div style="min-width:0;">
            <div style="font-family:'Oswald','Pretendard'; font-size:20px; font-weight:700; color:#FFFFFF; letter-spacing:2.5px;">WHISTLE FC</div>
            <div style="font-size:11px; color:#9FB4E4; letter-spacing:.5px;">휘슬의 축구 발자취</div>
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select value="{{ season }}" onChange="{{ onSeason }}" style="background:#F0D281; color:#113C98; font-size:13px; font-weight:800; padding:7px 12px; border-radius:18px; border:none; cursor:pointer; font-family:'Pretendard'; outline:none;">
            <option value="2026">2026 시즌</option><option value="2025">2025 시즌</option><option value="2024">2024 시즌</option><option value="2023">2023 시즌</option><option value="2022">2022 시즌</option><option value="2021">2021 시즌</option><option value="2020">2020 시즌</option><option value="2019">2019 시즌</option><option value="2018">2018 시즌</option><option value="2017">2017 시즌</option><option value="2016">2016 시즌</option><option value="2015">2015 시즌</option><option value="2014">2014 시즌</option><option value="2013">2013 시즌</option><option value="2012">2012 시즌</option><option value="2011">2011 시즌</option><option value="2010">2010 시즌</option><option value="2009">2009 시즌</option><option value="2008">2008 시즌</option><option value="2007">2007 시즌</option><option value="2006">2006 시즌</option><option value="2005">2005 시즌</option><option value="2004">2004 시즌</option><option value="2003">2003 시즌</option><option value="2002">2002 시즌</option><option value="2001">2001 시즌</option><option value="2000">2000 시즌</option>
          </select>
          <div onClick="{{ onAllTime }}" style="border:1.5px solid {{ allBtnBd }}; background:{{ allBtnBg }}; color:{{ allBtnColor }}; font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:18px; cursor:pointer;">{{ allBtnLabel }}</div>
        </div>
      </div>
      <div style="display:flex; gap:4px; margin-top:14px;">
        <sc-for list="{{ tabsTop }}" as="t" hint-placeholder-count="5">
          <div onClick="{{ t.onClick }}" style="flex:1; text-align:center; padding:10px 0; cursor:pointer; font-size:13px; font-weight:700; color:{{ t.color }}; background:{{ t.bg }}; border-radius:10px 10px 0 0;">{{ t.label }}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width:960px; margin:0 auto; padding:22px 20px 0;">

    <sc-if value="{{ hasStatus }}" hint-placeholder-val="{{ false }}">
      <div style="background:#EEF2FB; color:#113C98; font-size:12.5px; font-weight:600; text-align:center; padding:8px; border-radius:10px; margin-bottom:14px;">{{ statusMsg }}</div>
    </sc-if>

    <sc-if value="{{ vNorwich }}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFEC3D; border-radius:14px; padding:18px 20px; margin-bottom:18px; box-shadow:0 3px 12px rgba(90,80,0,.18);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <div>
            <div style="font-size:10.5px; font-weight:800; color:#00713C; letter-spacing:1.5px;">HIDDEN CANARY MODE</div>
            <div style="font-family:'Oswald','Pretendard'; font-size:19px; font-weight:700; color:#00522B; margin-top:2px;">NORWICH CITY FC! "OTBC"</div>
            <div style="font-size:11.5px; color:#4A6B1E; margin-top:2px;">{{ norLeague }}</div>
          </div>
          <div onClick="{{ onNorClose }}" style="width:26px; height:26px; border-radius:50%; background:#00A650; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; cursor:pointer;">×</div>
        </div>
        <div style="font-size:12px; color:#4A6B1E;">{{ norStatus }}</div>
        <div class="g-nor">
          <div style="background:#FFFFFF; border-radius:10px; overflow:hidden;">
            <div style="font-size:11px; font-weight:800; color:#00713C; padding:9px 14px; background:#E9F7EE;">리그 순위</div>
            <sc-for list="{{ norRows }}" as="r" hint-placeholder-count="5">
              <div style="display:grid; grid-template-columns:32px 1fr 44px 44px; align-items:center; padding:8px 14px; font-size:12.5px; background:{{ r.bg }}; color:{{ r.fg }}; font-weight:{{ r.weight }}; border-top:1px solid #F0F0E6;">
                <span>{{ r.rank }}</span><span>{{ r.team }}</span><span>{{ r.played }}경기</span><span>{{ r.pts }}점</span>
              </div>
            </sc-for>
          </div>
          <div style="background:#FFFFFF; border-radius:10px; overflow:hidden;">
            <div style="font-size:11px; font-weight:800; color:#00713C; padding:9px 14px; background:#E9F7EE;">최근 5경기</div>
            <sc-for list="{{ norLast }}" as="e" hint-placeholder-count="5">
              <div style="display:grid; grid-template-columns:44px 1fr auto 24px; align-items:center; gap:8px; padding:8px 14px; font-size:12px; border-top:1px solid #F0F0E6;">
                <span style="color:#8A8577;">{{ e.date }}</span>
                <span style="font-weight:700;">{{ e.opp }} <span style="font-weight:600; color:#B0AB9D;">({{ e.ha }})</span></span>
                <span style="font-family:'Oswald','Pretendard'; font-weight:600;">{{ e.score }}</span>
                <span style="width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; background:{{ e.resBg }}; color:{{ e.resColor }};">{{ e.resLabel }}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="font-size:11px; color:#00713C; font-weight:700; margin-top:10px; text-align:right;">On The Ball, City!</div>
      </div>
    </sc-if>

    <sc-if value="{{ vHome }}" hint-placeholder-val="{{ true }}">
      <div data-screen-label="Home" style="display:flex; flex-direction:column;">
        <div class="hero" style="background:#113C98; border-radius:14px; padding:20px 24px; display:flex; align-items:center; gap:20px;">
          <div style="font-family:'Oswald','Pretendard'; font-size:44px; font-weight:700; color:#F0D281; line-height:1;">{{ season }}</div>
          <div style="flex:1;">
            <div style="font-size:15px; font-weight:800; color:#FFFFFF;">{{ stRecord }}</div>
            <div style="font-size:12px; color:#9FB4E4; margin-top:3px;">승률 {{ stRate }}% · 득점 {{ stGoals }} · 실점 {{ stGa }}</div>
            <div style="font-size:12px; color:#F0D281; margin-top:3px; font-weight:700;">시즌 MVP {{ mvpName }} · {{ mvpSub }}</div>
          </div>
          <div style="display:flex; gap:5px; align-items:center;">
            <sc-for list="{{ formList }}" as="f" hint-placeholder-count="5">
              <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:{{ f.bg }}; color:{{ f.fg }};">{{ f.label }}</div>
            </sc-for>
            <div style="font-size:10.5px; color:#9FB4E4; margin-left:5px;">최근 5경기</div>
          </div>
        </div>

        <div class="g-home" style="margin-top:10px;">
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px 18px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
              <span style="font-size:13px; font-weight:800;">시즌 진행률</span>
              <span style="font-size:12px; font-weight:700; color:#113C98;">{{ progLabel }}</span>
            </div>
            <div style="height:12px; border-radius:6px; background:#EEF2FB; overflow:hidden;">
              <div style="height:100%; width:{{ progPct }}; background:linear-gradient(90deg,#113C98,#3A66C9); border-radius:6px;"></div>
            </div>
            <div style="font-size:11px; color:#B0AB9D; margin-top:8px;">{{ progSub }}</div>
          </div>
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px 18px; text-align:center;">
            <div style="font-size:10.5px; font-weight:700; color:#C9A227; letter-spacing:1px;">SINCE 2000. 5. 9</div>
            <div style="font-family:'Oswald','Pretendard'; font-size:22px; font-weight:700; color:#113C98; margin:8px 0 2px;">창단 {{ foundYears }}주년</div>
          </div>
        </div>

        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">최근 경기</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ recentMatches }}" as="m" hint-placeholder-count="3">
            <div style="display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:14px; background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:13px 16px;">
              <div>
                <div style="font-size:14.5px; font-weight:700;">vs {{ m.opponent }}</div>
                <div style="font-size:11px; color:#B0AB9D; margin-top:2px;">{{ m.date }} · WHISTLE LEAGUE</div>
              </div>
              <div style="font-family:'Oswald','Pretendard'; font-size:20px; font-weight:700; color:#113C98;">{{ m.score }}</div>
              <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; background:{{ m.resBg }}; color:{{ m.resColor }};">{{ m.resLabel }}</div>
            </div>
          </sc-for>
        </div>

        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">다음 경기 일정 및 구장 위치</div>
        <div class="g-sched">
          <div style="display:flex; flex-direction:column; gap:8px;">
            <sc-for list="{{ schedules }}" as="s" hint-placeholder-count="2">
              <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px;">
                <div style="background:#EEF2FB; border-radius:10px; padding:9px 13px; text-align:center; min-width:56px;">
                  <div style="font-size:16px; font-weight:800; color:#113C98;">{{ s.dateShort }}</div>
                  <div style="font-size:10.5px; color:#7C8AAB;">{{ s.time }}</div>
                </div>
                <div>
                  <div style="font-size:14.5px; font-weight:800;">vs {{ s.opponent }}</div>
                  <div style="font-size:11.5px; color:#8A8577; margin-top:3px;">{{ s.venue }}</div>
                </div>
              </div>
            </sc-for>
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:14px 16px;">
              <div style="font-size:13px; font-weight:800;">{{ venueName }}</div>
              <div style="font-size:11.5px; color:#8A8577; margin-top:4px;">{{ venueAddr }}</div>
              <div style="font-size:11.5px; color:#8A8577; margin-top:2px;">{{ venueInfo }}</div>
            </div>
          </div>
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden;">
            <div id="venueMap" data-address="{{ venueAddr }}" data-name="{{ venueName }}" style="width:100%; height:100%; min-height:240px;"></div>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ vSeasons }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Seasons">
        <div class="hero" style="background:#113C98; border-radius:12px; padding:20px 24px; display:flex; align-items:center; gap:20px; margin-bottom:14px;">
          <div style="font-family:'Oswald','Pretendard'; font-size:44px; font-weight:700; color:#F0D281; line-height:1;">{{ season }}</div>
          <div style="flex:1;">
            <div style="font-size:15px; font-weight:800; color:#FFFFFF;">{{ stRecord }}</div>
            <div style="font-size:12px; color:#9FB4E4; margin-top:3px;">승률 {{ stRate }}% · 득점 {{ stGoals }} · 실점 {{ stGa }}</div>
          </div>
          <div style="display:flex; gap:5px; align-items:center;">
            <sc-for list="{{ formList }}" as="f" hint-placeholder-count="5">
              <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:{{ f.bg }}; color:{{ f.fg }};">{{ f.label }}</div>
            </sc-for>
            <div style="font-size:10.5px; color:#9FB4E4; margin-left:5px;">최근 5경기</div>
          </div>
        </div>

        <div class="g-4">
          <sc-for list="{{ seasonCards }}" as="c" hint-placeholder-count="4">
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-top:3px solid {{ c.accent }}; border-radius:14px; padding:14px 12px; text-align:center;">
              <div style="font-size:11px; font-weight:700; color:#8A8577;">{{ c.title }}</div>
              <div style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98; margin:6px 0 3px;">{{ c.value }}</div>
              <div style="font-size:11px; color:#B0AB9D;">{{ c.sub }}</div>
            </div>
          </sc-for>
        </div>

        <div class="g-3" style="margin-top:14px;">
          <sc-for list="{{ seasonBest }}" as="b" hint-placeholder-count="3">
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;">
              <div style="width:36px; height:36px; border-radius:50%; background:#FAF3DC; border:1.5px solid #F0D281; display:flex; align-items:center; justify-content:center; font-family:'Oswald','Pretendard'; font-size:15px; font-weight:700; color:#A5841B;">{{ b.icon }}</div>
              <div>
                <div style="font-size:11px; font-weight:700; color:#8A8577;">{{ b.title }}</div>
                <div style="font-size:15px; font-weight:800; margin-top:2px;">{{ b.name }} <span style="font-size:12px; font-weight:700; color:#A5841B;">{{ b.sub }}</span></div>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px 18px; margin-top:14px;">
          <div style="font-size:13px; font-weight:800; margin-bottom:10px;">승 · 무 · 패 비율</div>
          <div style="display:flex; height:14px; border-radius:7px; overflow:hidden; background:#F3F1EA;">
            <div style="width:{{ wdlWin }}; background:#2E7D4F;"></div>
            <div style="width:{{ wdlDraw }}; background:#E0B94B;"></div>
            <div style="width:{{ wdlLoss }}; background:#C0392B;"></div>
          </div>
          <div style="display:flex; gap:16px; margin-top:9px; font-size:12px; color:#8A8577;">
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#2E7D4F; display:inline-block;"></span>승 {{ wdlWinN }}</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#E0B94B; display:inline-block;"></span>무 {{ wdlDrawN }}</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#C0392B; display:inline-block;"></span>패 {{ wdlLossN }}</span>
          </div>
        </div>

        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px 18px; margin-top:14px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;">
            <span style="font-size:13px; font-weight:800;">월별 득점 · 실점</span>
            <span style="display:flex; gap:14px; font-size:11.5px; color:#8A8577;">
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:9px; height:9px; border-radius:2px; background:#113C98; display:inline-block;"></span>득점</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:9px; height:9px; border-radius:2px; background:#D9C27A; display:inline-block;"></span>실점</span>
            </span>
          </div>
          <div style="display:flex; align-items:flex-end; gap:8px; height:110px;">
            <sc-for list="{{ monthly }}" as="mo" hint-placeholder-count="12">
              <div onMouseEnter="{{ mo.onEnter }}" onMouseLeave="{{ mo.onLeave }}" onClick="{{ mo.onEnter }}" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; position:relative; cursor:pointer;">
                <div style="display:{{ mo.tipDisplay }}; position:absolute; top:-6px; left:50%; transform:translateX(-50%); background:#113C98; color:#FFFFFF; font-size:11px; font-weight:700; padding:4px 9px; border-radius:8px; white-space:nowrap; z-index:5;">득점 {{ mo.gf }} · 실점 {{ mo.ga }}</div>
                <div style="display:flex; align-items:flex-end; gap:3px;">
                  <div style="width:12px; height:{{ mo.gfH }}; background:#113C98; border-radius:3px 3px 0 0;"></div>
                  <div style="width:12px; height:{{ mo.gaH }}; background:#D9C27A; border-radius:3px 3px 0 0;"></div>
                </div>
                <div style="font-size:10.5px; color:#B0AB9D;">{{ mo.label }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ vMatches }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Matches">
        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">경기 결과</div>
        <div style="display:flex; gap:6px; margin-bottom:14px;">
          <sc-for list="{{ matchChips }}" as="ch" hint-placeholder-count="2">
            <div onClick="{{ ch.onClick }}" style="background:{{ ch.bg }}; border:1px solid {{ ch.bd }}; color:{{ ch.color }}; font-size:12px; font-weight:700; padding:6px 14px; border-radius:16px; cursor:pointer;">{{ ch.label }}</div>
          </sc-for>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ matchList }}" as="m" hint-placeholder-count="6">
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:14px 16px;">
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="font-size:11.5px; color:#B0AB9D;">{{ m.date }}</span>
                <span style="font-size:10.5px; color:#C9A227; font-weight:800; letter-spacing:.5px;">WHISTLE LEAGUE</span>
              </div>
              <div style="display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:14px;">
                <div>
                  <div style="font-size:15.5px; font-weight:700;">{{ m.opponent }}</div>
                  <div style="font-size:11px; color:#B0AB9D; margin-top:2px;">HOME · WHISTLE</div>
                </div>
                <div style="font-family:'Oswald','Pretendard'; font-size:21px; font-weight:700; color:#113C98;">{{ m.score }}</div>
                <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; background:{{ m.resBg }}; color:{{ m.resColor }};">{{ m.resLabel }}</div>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:9px; border-top:1px solid #F0EEE7;">
                <span style="font-size:11px; color:#113C98; background:#EEF2FB; padding:3px 9px; border-radius:8px; font-weight:600;">MVP {{ m.mvp }}</span>
                <span onClick="{{ m.onToggle }}" style="font-size:11.5px; color:#113C98; font-weight:700; cursor:pointer;">{{ m.toggleLabel }}</span>
              </div>
              <div style="display:{{ m.detailDisplay }}; margin-top:10px; padding-top:10px; border-top:1px solid #E7E4DB;">
                <div style="font-size:12px; color:#B0AB9D;">{{ m.detailNote }}</div>
                <div style="font-size:11px; font-weight:800; color:#C9A227; letter-spacing:.5px; margin-bottom:6px;">{{ m.lineupLabel }}</div>
                <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;">
                  <sc-for list="{{ m.lineup }}" as="nm" hint-placeholder-count="6">
                    <span style="font-size:12px; background:#EEF2FB; color:#113C98; padding:3px 10px; border-radius:10px;">{{ nm }}</span>
                  </sc-for>
                </div>
                <div style="font-size:11px; font-weight:800; color:#C9A227; letter-spacing:.5px; margin-bottom:6px;">{{ m.goalLabel }}</div>
                <div style="display:flex; flex-wrap:wrap; gap:5px;">
                  <sc-for list="{{ m.goalChips }}" as="g" hint-placeholder-count="2">
                    <span style="font-size:12px; background:#FAF3DC; color:#A5841B; padding:3px 10px; border-radius:10px;">{{ g }}</span>
                  </sc-for>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ vPlayers }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Players">
        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">선수별 통계</div>
        <div style="display:flex; gap:6px; margin-bottom:14px;">
          <sc-for list="{{ playerChips }}" as="ch" hint-placeholder-count="4">
            <div onClick="{{ ch.onClick }}" style="background:{{ ch.bg }}; border:1px solid {{ ch.bd }}; color:{{ ch.color }}; font-size:12px; font-weight:700; padding:6px 14px; border-radius:16px; cursor:pointer;">{{ ch.label }}</div>
          </sc-for>
        </div>
        <div style="display:flex; flex-direction:column; gap:7px;">
          <sc-for list="{{ playerList }}" as="p" hint-placeholder-count="8">
            <div style="display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:12px; background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:12px 16px;">
              <div style="width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; background:{{ p.rankBg }}; color:{{ p.rankColor }};">{{ p.rank }}</div>
              <div>
                <div style="font-size:14.5px; font-weight:700;">{{ p.name }}</div>
                <div style="display:flex; gap:5px; margin-top:5px; flex-wrap:wrap;">
                  <sc-for list="{{ p.statChips }}" as="sc" hint-placeholder-count="3">
                    <span style="font-size:10.5px; color:{{ sc.color }}; background:{{ sc.bg }}; padding:2px 8px; border-radius:8px; font-weight:{{ sc.weight }};">{{ sc.label }}</span>
                  </sc-for>
                </div>
              </div>
              <div style="font-size:12px; font-weight:800; padding:4px 10px; border-radius:10px; background:{{ p.badgeBg }}; color:{{ p.badgeColor }};">{{ p.badgeLabel }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ vRecords }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Records">
        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">역대 팀 기록</div>
        <div class="g-3" style="margin-bottom:10px;">
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-top:3px solid #113C98; border-radius:14px; padding:14px 12px; text-align:center;">
            <div style="font-size:11px; font-weight:700; color:#8A8577;">총 경기</div>
            <div style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98; margin:6px 0 3px;">{{ ovMatches }}</div>
            <div style="font-size:11px; color:#B0AB9D;">{{ ovRecord }}</div>
          </div>
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-top:3px solid #113C98; border-radius:14px; padding:14px 12px; text-align:center;">
            <div style="font-size:11px; font-weight:700; color:#8A8577;">통산 승률</div>
            <div style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98; margin:6px 0 3px;">{{ ovRate }}%</div>
            <div style="font-size:11px; color:#B0AB9D;">2000–2026</div>
          </div>
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-top:3px solid #113C98; border-radius:14px; padding:14px 12px; text-align:center;">
            <div style="font-size:11px; font-weight:700; color:#8A8577;">득점 / 실점</div>
            <div style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98; margin:6px 0 3px;">{{ ovGf }} / {{ ovGa }}</div>
            <div style="font-size:11px; color:#B0AB9D;">통산 합계</div>
          </div>
        </div>
        <div class="g-2" style="margin-bottom:18px;">
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-left:3px solid #15803D; border-radius:14px; padding:12px 16px;">
            <div style="font-size:11px; font-weight:700; color:#8A8577; margin-bottom:4px;">최대 승리</div>
            <div style="font-size:14px; font-weight:800;">{{ bigWin }}</div>
          </div>
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-left:3px solid #C0392B; border-radius:14px; padding:12px 16px;">
            <div style="font-size:11px; font-weight:700; color:#8A8577; margin-bottom:4px;">최대 패배</div>
            <div style="font-size:14px; font-weight:800;">{{ bigLoss }}</div>
          </div>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px 18px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;">
            <span style="font-size:13px; font-weight:800;">시즌별 승률 추이</span>
            <span style="font-size:11px; color:#B0AB9D;">2000 → 2026 · 금색 = 최고 승률 시즌</span>
          </div>
          <div class="trend-scroll">
          <div style="display:flex; align-items:flex-end; gap:3px; height:90px; min-width:640px;">
            <sc-for list="{{ trendBars }}" as="tb" hint-placeholder-count="27">
              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end;">
                <div style="width:100%; height:{{ tb.h }}; background:{{ tb.bg }}; border-radius:3px 3px 0 0;"></div>
                <div style="font-size:9px; color:#B0AB9D;">{{ tb.label }}</div>
              </div>
            </sc-for>
          </div>
          </div>
        </div>
        <div style="display:flex; gap:6px; margin-bottom:12px;">
          <sc-for list="{{ teamChips }}" as="ch" hint-placeholder-count="4">
            <div onClick="{{ ch.onClick }}" style="background:{{ ch.bg }}; border:1px solid {{ ch.bd }}; color:{{ ch.color }}; font-size:12px; font-weight:700; padding:6px 14px; border-radius:16px; cursor:pointer;">{{ ch.label }}</div>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden; margin-bottom:26px; max-height:380px; overflow-y:auto;">
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr; padding:10px 16px; background:#F6F5F1; position:sticky; top:0;">
            <span style="font-size:11px; font-weight:800; color:#8A8577;">시즌</span><span style="font-size:11px; font-weight:800; color:#8A8577;">경기수</span><span style="font-size:11px; font-weight:800; color:#8A8577;">승</span><span style="font-size:11px; font-weight:800; color:#8A8577;">무</span><span style="font-size:11px; font-weight:800; color:#8A8577;">패</span><span style="font-size:11px; font-weight:800; color:#8A8577;">승률</span>
          </div>
          <sc-for list="{{ seasonRows }}" as="r" hint-placeholder-count="8">
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr; padding:10px 16px; border-top:1px solid #F0EEE7; font-size:13px;">
              <span style="font-weight:700;">{{ r.season }}</span><span>{{ r.matches }}</span><span>{{ r.wins }}</span><span>{{ r.draws }}</span><span>{{ r.losses }}</span><span style="font-weight:700; color:{{ r.rateColor }};">{{ r.winRate }}%</span>
            </div>
          </sc-for>
        </div>

        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">역대 선수 기록</div>
        <div class="g-3" style="margin-bottom:12px;">
          <sc-for list="{{ highlights }}" as="h" hint-placeholder-count="3">
            <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;">
              <div style="width:36px; height:36px; border-radius:50%; background:#FAF3DC; border:1.5px solid #F0D281; display:flex; align-items:center; justify-content:center; font-family:'Oswald','Pretendard'; font-size:14px; font-weight:700; color:#A5841B;">{{ h.icon }}</div>
              <div>
                <div style="font-size:11px; font-weight:700; color:#8A8577;">{{ h.title }}</div>
                <div style="font-size:15px; font-weight:800; margin-top:2px;">{{ h.name }} <span style="font-size:12px; font-weight:700; color:#A5841B;">{{ h.sub }}</span></div>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden; margin-bottom:26px; max-height:380px; overflow-y:auto;">
          <div style="display:grid; grid-template-columns:44px 1.6fr 1fr 1fr 1fr 1fr; align-items:center; padding:10px 16px; background:#F6F5F1; position:sticky; top:0;">
            <span style="font-size:11px; font-weight:800; color:#8A8577;">#</span><span style="font-size:11px; font-weight:800; color:#8A8577;">이름</span><span style="font-size:11px; font-weight:800; color:#8A8577;">데뷔</span><span style="font-size:11px; font-weight:800; color:#8A8577;">총 출장</span><span style="font-size:11px; font-weight:800; color:#8A8577;">총 득점</span><span style="font-size:11px; font-weight:800; color:#8A8577;">총 MVP</span>
          </div>
          <sc-for list="{{ allPlayers }}" as="p" hint-placeholder-count="8">
            <div style="display:grid; grid-template-columns:44px 1.6fr 1fr 1fr 1fr 1fr; align-items:center; padding:8px 16px; border-top:1px solid #F0EEE7; font-size:13px;">
              <span><span style="width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; background:{{ p.rankBg }}; color:{{ p.rankColor }};">{{ p.rank }}</span></span>
              <span style="font-weight:700;">{{ p.name }}</span><span style="color:#8A8577;">{{ p.debut }}</span><span>{{ p.ap }}</span><span style="font-weight:700; color:#113C98;">{{ p.goals }}</span><span>{{ p.mvp }}</span>
            </div>
          </sc-for>
        </div>

        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">지역별 경기 기록</div>
        <div style="display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;">
          <sc-for list="{{ regionalChips }}" as="ch" hint-placeholder-count="4">
            <div onClick="{{ ch.onClick }}" style="background:{{ ch.bg }}; border:1px solid {{ ch.bd }}; color:{{ ch.color }}; font-size:12px; font-weight:700; padding:6px 14px; border-radius:16px; cursor:pointer;">{{ ch.label }}</div>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden; margin-bottom:12px; max-height:420px; overflow-y:auto;">
          <div style="display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr; padding:10px 16px; background:#F6F5F1; position:sticky; top:0; z-index:1;">
            <span style="font-size:11px; font-weight:800; color:#8A8577;">지역</span><span style="font-size:11px; font-weight:800; color:#8A8577;">경기수</span><span style="font-size:11px; font-weight:800; color:#8A8577;">승</span><span style="font-size:11px; font-weight:800; color:#8A8577;">무</span><span style="font-size:11px; font-weight:800; color:#8A8577;">패</span><span style="font-size:11px; font-weight:800; color:#8A8577;">승률</span>
          </div>
          <sc-for list="{{ regionalGroups }}" as="g" hint-placeholder-count="3">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:{{ g.bg }}; border-top:1px solid #E7E4DB; border-left:4px solid {{ g.color }};">
              <span style="font-size:12px; font-weight:800; color:{{ g.color }};">{{ g.name }}</span>
              <span style="font-size:11px; font-weight:600; color:{{ g.color }}; opacity:.75;">{{ g.summary }}</span>
            </div>
            <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="6">
              <div style="display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr; padding:9px 16px; border-top:1px solid #F0EEE7; font-size:13px;">
                <span style="font-weight:700; color:{{ g.color }};">{{ r.region }}</span><span>{{ r.matches }}</span><span>{{ r.wins }}</span><span>{{ r.draws }}</span><span>{{ r.losses }}</span><span style="font-weight:700; color:{{ r.rateColor }};">{{ r.winRate }}%</span>
              </div>
            </sc-for>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
            <div style="font-size:13.5px; font-weight:800;">지역별 승률 히트맵</div>
            <div style="display:flex; gap:12px; font-size:11px; color:#8A8577;">
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:#CDEBD8; display:inline-block;"></span>60% 이상</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:#F6ECC8; display:inline-block;"></span>40–60%</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:#F6D5D5; display:inline-block;"></span>40% 미만</span>
            </div>
          </div>
          <sc-for list="{{ regionalGroups }}" as="g" hint-placeholder-count="3">
            <div style="font-size:11.5px; font-weight:800; color:{{ g.color }}; margin:14px 0 6px; letter-spacing:.3px;">{{ g.name }} <span style="font-weight:600; color:#B0AB9D;">{{ g.count }}</span></div>
            <sc-if value="{{ g.isSeoul }}" hint-placeholder-val="{{ false }}">
              <div class="seoul-map">
                <div style="display:flex; align-items:center; gap:14px; background:{{ g.sel.bg }}; border-radius:12px; padding:12px 16px; margin-bottom:8px; visibility:{{ g.selVis }};">
                  <div style="font-family:'Oswald','Pretendard'; font-size:38px; font-weight:700; line-height:1; color:{{ g.sel.fg }}; font-variant-numeric:tabular-nums; min-width:112px;">{{ g.sel.winRate }}%</div>
                  <div style="flex:1; min-width:0;">
                    <div style="font-size:16px; font-weight:800; color:{{ g.sel.fg }};">{{ g.sel.gu }}</div>
                    <div style="font-size:12px; color:{{ g.sel.fg }}; opacity:.85; margin-top:2px;">{{ g.sel.matches }}경기 · {{ g.sel.record }} · 승률 {{ g.sel.rank }}위/{{ g.sel.total }}</div>
                  </div>
                </div>
                <svg viewBox="0 0 400 340" role="img" aria-label="서울 자치구별 승률 지도">
                  <rect x="0" y="0" width="400" height="340" fill="transparent" onClick="{{ g.onMapBlank }}"></rect>
                  <sc-for list="{{ g.mapCells }}" as="d" hint-placeholder-count="25">
                    <path d="{{ d.path }}" fill="{{ d.fill }}" stroke="{{ d.stroke }}" stroke-width="{{ d.strokeWidth }}" stroke-linejoin="round" onMouseEnter="{{ d.onPick }}" onClick="{{ d.onPick }}"><title>{{ d.tip }}</title></path>
                  </sc-for>
                  <sc-for list="{{ g.mapCells }}" as="d" hint-placeholder-count="25">
                    <text x="{{ d.cx }}" y="{{ d.cy }}" text-anchor="middle" font-size="9.5" font-weight="800" fill="{{ d.labelColor }}" style="pointer-events:none;">{{ d.label }}</text>
                    <text x="{{ d.cx }}" y="{{ d.cy2 }}" text-anchor="middle" font-size="8.5" font-weight="600" fill="{{ d.labelColor }}" style="pointer-events:none;">{{ d.sub }}</text>
                  </sc-for>
                </svg>
              </div>
            </sc-if>
            <sc-if value="{{ g.notSeoul }}" hint-placeholder-val="{{ true }}">
            <div class="g-heat">
              <sc-for list="{{ g.heat }}" as="c" hint-placeholder-count="6">
                <div style="background:{{ c.bg }}; border-radius:8px; padding:8px 10px; min-width:0;">
                  <div style="font-size:12px; font-weight:800; color:{{ c.fg }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ c.region }}</div>
                  <div style="font-size:11px; color:{{ c.fg }}; margin-top:2px; font-variant-numeric:tabular-nums;">{{ c.winRate }}% · {{ c.matches }}경기</div>
                </div>
              </sc-for>
            </div>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="position:fixed; bottom:0; left:0; right:0; z-index:100; background:#FFFFFF; border-top:1px solid #E7E4DB; box-shadow:0 -2px 10px rgba(17,30,60,.08);">
    <div style="max-width:960px; margin:0 auto; display:flex;">
      <sc-for list="{{ tabsBottom }}" as="t" hint-placeholder-count="5">
        <div onClick="{{ t.onClick }}" style="flex:1; text-align:center; padding:11px 4px 13px; cursor:pointer; font-size:12px; font-weight:700; color:{{ t.color }}; border-top:3px solid {{ t.bd }};">{{ t.label }}</div>
      </sc-for>
    </div>
  </div>

</div>
</template>

<script src="./seoul_districts.js" defer></script>
<script src="./script.js" defer></script>
</body>
</html>
