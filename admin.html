<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WHISTLE FC · 운영진 관리</title>
<link rel="icon" href="whistle_logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
/* Claude Design 프로젝트 7704b360 "Admin.dc.html"을 옮긴 관리자 화면. 마크업·인라인 스타일은 디자인 그대로 */
* { box-sizing: border-box; }
body { margin: 0; background: #F6F5F1; font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; -webkit-font-smoothing: antialiased; }
a { color: #113C98; text-decoration: none; }
a:hover { color: #0C53C2; }
input, select, textarea, button { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }
select { -webkit-appearance: none; appearance: none; }
input:focus, select:focus, textarea:focus { border-color: #113C98 !important; outline: none; }
[role="switch"], [role="checkbox"] { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div style="min-height:100vh; background:#F6F5F1; padding-bottom:120px;">

  <div data-screen-label="헤더" style="position:sticky; top:0; z-index:100; background:#113C98; box-shadow:0 2px 12px rgba(17,30,60,.18);">
    <div style="max-width:560px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:10px;">
      <img src="whistle_logo.svg" alt="WHISTLE" style="width:36px; height:36px; border-radius:10px; border:2px solid #F0D281; display:block;">
      <div style="flex:1; min-width:0;">
        <div style="font-family:'Oswald','Pretendard'; font-size:18px; font-weight:700; color:#FFFFFF; letter-spacing:2px;">WHISTLE FC</div>
        <div style="font-size:12px; color:#9FB4E4; letter-spacing:.5px;">운영진 관리</div>
      </div>
      <a href="index.html" style="font-size:12.5px; font-weight:700; color:#F0D281; padding:8px 0;">사이트 보기</a>
    </div>
  </div>

  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; top:70px; left:0; right:0; z-index:300; padding:0 12px; display:flex; justify-content:center; pointer-events:none;">
      <div role="status" style="pointer-events:auto; width:100%; max-width:536px; display:flex; align-items:flex-start; gap:12px; padding:14px 14px 14px 16px; border-radius:14px; background:{{ toast.bg }}; color:#FFFFFF; box-shadow:0 8px 24px rgba(17,30,60,.28);">
        <span style="width:26px; height:26px; flex-shrink:0; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;">{{ toast.icon }}</span>
        <div style="flex:1; min-width:0; padding-top:3px;">
          <div style="font-size:15px; font-weight:800;">{{ toast.msg }}</div>
          <sc-if value="{{ toast.hasSub }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:13px; margin-top:3px; line-height:1.45;">{{ toast.sub }}</div>
          </sc-if>
        </div>
        <div onClick="{{ closeToast }}" style="width:32px; height:32px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; cursor:pointer;">&times;</div>
      </div>
    </div>
  </sc-if>

  <div style="max-width:560px; margin:0 auto; padding:16px 14px;">

    <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="로그인" style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:24px 18px; margin-top:24px; display:flex; flex-direction:column; gap:12px;">
        <div style="font-size:18px; font-weight:800;">운영진 로그인</div>
        <sc-if value="{{ byLogout }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:13px; color:#6B675C; margin-top:-6px;">로그아웃되었습니다.</div>
        </sc-if>
        <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">운영진 PIN<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" id="pinInput" value="{{ pin }}" onInput="{{ onPin }}" onKeyDown="{{ onPinKey }}" placeholder="6~8자리 숫자" style="width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid {{ pinBd }}; background:#F6F5F1; font-family:'Oswald','Pretendard'; font-size:22px; font-weight:600; letter-spacing:8px; text-align:center; color:#113C98; outline:none;" style-focus="border-color:#113C98;"></label>
        <sc-if value="{{ hasPinErr }}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="font-size:13.5px; font-weight:700; color:#C0392B; background:#FBE9E9; border-radius:10px; padding:10px 12px;">{{ pinErr }}</div>
        </sc-if>
        <div onClick="{{ toggleKeep }}" role="checkbox" style="display:flex; align-items:center; gap:10px; min-height:44px; cursor:pointer;">
          <span style="width:24px; height:24px; border-radius:7px; border:1.5px solid {{ keepBd }}; background:{{ keepBg }}; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;">{{ keepMark }}</span>
          <span style="font-size:14px; font-weight:700;">이 기기에서 로그인 유지</span>
        </div>
        <div onClick="{{ login }}" style="min-height:50px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:#113C98; color:#FFFFFF; font-size:15px; font-weight:800; cursor:pointer; opacity:{{ loginOp }};">들어가기</div>
      </div>
    </sc-if>

    <sc-if value="{{ vGames }}" hint-placeholder-val="{{ true }}">
      <div data-screen-label="경기" style="display:flex; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">
          <span style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700;">다가오는 경기</span>
          <div onClick="{{ newSchedule }}" style="min-height:36px; padding:0 14px; display:flex; align-items:center; border-radius:18px; background:#113C98; color:#FFFFFF; font-size:13px; font-weight:800; cursor:pointer;">+ 일정 추가</div>
        </div>

        <sc-if value="{{ noNext }}" hint-placeholder-val="{{ false }}">
          <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:22px 18px; text-align:center;">
            <div style="font-size:14px; font-weight:800;">등록된 다음 경기가 없습니다</div>
            <div style="font-size:12.5px; color:#6B675C; margin-top:4px;">일정을 추가하면 메인 사이트에서 참석 투표가 열려요.</div>
          </div>
        </sc-if>

        <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
          <div style="background:#113C98; border-radius:14px; overflow:hidden; box-shadow:0 3px 12px rgba(17,30,60,.18);">
            <div style="padding:18px; display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px 18px;">
              <div style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;">
                <div style="background:#F0D281; color:#113C98; font-family:'Oswald','Pretendard'; font-size:13px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:8px;">{{ next.dday }}</div>
                <div style="font-family:'Oswald','Pretendard'; font-size:40px; font-weight:700; color:#F0D281; line-height:1;">{{ next.dateShort }}</div>
                <div style="font-size:13px; color:#9FB4E4;">{{ next.when }}</div>
              </div>
              <div style="flex:1; min-width:150px;">
                <div style="font-size:12px; font-weight:800; color:#F0D281; letter-spacing:1.5px;">WHISTLE LEAGUE</div>
                <div style="font-size:21px; font-weight:800; color:#FFFFFF; margin-top:4px;">vs {{ next.opp }}</div>
                <div style="font-size:13px; color:#CBD8F5; margin-top:8px;">{{ next.venue }}</div>
                <div style="font-size:12.5px; color:#9FB4E4; margin-top:2px;">{{ next.address }}</div>
              </div>
              <div onClick="{{ editSchedule }}" style="flex-basis:100%; min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; border:1.5px solid #4C6CC0; background:rgba(255,255,255,.06); color:#F0D281; font-size:14px; font-weight:800; cursor:pointer;">일정 수정</div>
            </div>
            <div style="background:#FFFFFF; padding:16px;">
              <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px;">
                <span style="font-size:15px; font-weight:800;">참석 현황</span>
                <span style="font-size:12.5px; color:#6B675C;">{{ next.sub }}</span>
              </div>
              <div style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:12px;">
                <sc-for list="{{ next.counts }}" as="c" hint-placeholder-count="4">
                  <div style="background:{{ c.bg }}; border-radius:10px; padding:9px 4px; text-align:center;">
                    <div style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:{{ c.fg }}; line-height:1.1;">{{ c.n }}</div>
                    <div style="font-size:12px; font-weight:800; color:{{ c.fg }}; margin-top:2px;">{{ c.label }}</div>
                  </div>
                </sc-for>
              </div>
              <div style="display:flex; flex-direction:column; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid #F0EEE7;">
                <sc-for list="{{ next.groups }}" as="g" hint-placeholder-count="4">
                  <div style="display:grid; grid-template-columns:44px 1fr; gap:8px; align-items:start;">
                    <span style="font-size:12px; font-weight:800; color:{{ g.color }}; padding-top:5px;">{{ g.label }}</span>
                    <div style="display:flex; flex-wrap:wrap; gap:5px;">
                      <sc-for list="{{ g.names }}" as="p" hint-placeholder-count="5">
                        <span style="font-size:13.5px; padding:5px 11px; border-radius:10px; background:{{ g.bg }}; color:{{ g.fg }}; font-weight:600;">{{ p }}</span>
                      </sc-for>
                      <sc-if value="{{ g.empty }}" hint-placeholder-val="{{ false }}">
                        <span style="font-size:13px; color:#8A8577; padding:4px 0;">없음</span>
                      </sc-if>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ hasLater }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">
            <span style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700;">이후 일정</span>
            <span style="font-size:12.5px; color:#8A8577;">눌러서 수정·삭제</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <sc-for list="{{ laterRows }}" as="l" hint-placeholder-count="2">
              <div onClick="{{ l.onClick }}" style="display:grid; grid-template-columns:minmax(0,1fr) 14px; align-items:center; gap:12px; background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:13px 14px 13px 16px; cursor:pointer;">
                <div style="min-width:0;">
                  <div style="font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">vs {{ l.opp }}</div>
                  <div style="font-size:12px; color:#8A8577; margin-top:2px;">{{ l.dateLabel }} {{ l.time }} · {{ l.venue }}</div>
                </div>
                <span style="font-size:20px; color:#B0AB9D; font-weight:600;">›</span>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">
          <span style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700;">지난 경기</span>
          <sc-if value="{{ hasPending }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12.5px; font-weight:800; color:#C0392B;">결과 미입력 {{ pendingCount }}경기</span>
          </sc-if>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ pastRows }}" as="m" hint-placeholder-count="5">
            <div onClick="{{ m.onClick }}" style="display:grid; grid-template-columns:minmax(0,1fr) auto 14px; align-items:center; gap:12px; background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:13px 14px 13px 16px; cursor:pointer; border:1.5px solid {{ m.bd }};">
              <div style="min-width:0;">
                <div style="font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">vs {{ m.opp }}</div>
                <div style="font-size:12px; color:#8A8577; margin-top:2px;">{{ m.dateLabel }} · {{ m.venue }}</div>
              </div>
              <sc-if value="{{ m.needs }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:12px; font-weight:800; padding:5px 10px; border-radius:10px; background:#FBE9E9; color:#C0392B; white-space:nowrap;">결과 입력 필요</span>
              </sc-if>
              <sc-if value="{{ m.hasRes }}" hint-placeholder-val="{{ true }}">
                <div style="display:flex; align-items:center; gap:10px;">
                  <span style="font-family:'Oswald','Pretendard'; font-size:20px; font-weight:700; color:#113C98;">{{ m.score }}</span>
                  <span style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; background:{{ m.resBg }}; color:{{ m.resColor }};">{{ m.resLabel }}</span>
                </div>
              </sc-if>
              <span style="font-size:20px; color:#B0AB9D; font-weight:600;">›</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ vMatch }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="경기 기록 입력" style="display:flex; flex-direction:column; gap:10px;">
        <div onClick="{{ back }}" style="align-self:flex-start; min-height:40px; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:800; color:#113C98; cursor:pointer;"><span style="font-size:20px;">‹</span>경기 목록</div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding-bottom:8px; border-bottom:2px solid #113C98;">
          <div>
            <div style="font-size:12.5px; color:#6B675C;">{{ mf.dateLabel }}</div>
            <div style="font-size:20px; font-weight:800; margin-top:2px;">vs {{ mf.opp }}</div>
          </div>
          <sc-if value="{{ mf.isNew }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12px; font-weight:800; padding:5px 10px; border-radius:10px; background:#FBE9E9; color:#C0392B;">결과 입력 필요</span>
          </sc-if>
        </div>

        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:14px;">
          <div style="font-size:15px; font-weight:800;">경기 정보</div>
          <div style="display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; background:#F6F5F1; border-radius:12px; padding:14px 10px;">
            <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
              <span style="font-size:12px; font-weight:800; color:#113C98; letter-spacing:1px;">WHISTLE</span>
              <div style="display:flex; align-items:center; gap:8px;">
                <div onClick="{{ decOur }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#113C98; cursor:pointer;">&minus;</div>
                <span style="min-width:32px; text-align:center; font-family:'Oswald','Pretendard'; font-size:38px; font-weight:700; color:#113C98; line-height:1;">{{ mf.our }}</span>
                <div onClick="{{ incOur }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #113C98; background:#113C98; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#FFFFFF; cursor:pointer;">+</div>
              </div>
            </div>
            <span style="font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#B0AB9D; padding-top:22px;">:</span>
            <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
              <span style="font-size:12px; font-weight:800; color:#6B675C; letter-spacing:1px;">상대</span>
              <div style="display:flex; align-items:center; gap:8px;">
                <div onClick="{{ decTheir }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#113C98; cursor:pointer;">&minus;</div>
                <span style="min-width:32px; text-align:center; font-family:'Oswald','Pretendard'; font-size:38px; font-weight:700; color:#1A1A1A; line-height:1;">{{ mf.their }}</span>
                <div onClick="{{ incTheir }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #113C98; background:#113C98; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#FFFFFF; cursor:pointer;">+</div>
              </div>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;">
            <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">날짜<input type="date" value="{{ mf.date }}" onChange="{{ mf.onDate }}" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
            <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">상대팀<input value="{{ mf.opp }}" onChange="{{ mf.onOpp }}" placeholder="예: Dream FC" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
            <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">지역<input value="{{ mf.region }}" onChange="{{ mf.onRegion }}" placeholder="예: 노원구" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
            <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">장소<input value="{{ mf.venue }}" onChange="{{ mf.onVenue }}" placeholder="예: 은로초등학교" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <div>
              <div style="font-size:14px; font-weight:800;">용병 수</div>
              <div style="font-size:12.5px; color:#6B675C; margin-top:2px;">{{ mf.mercHint }}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div onClick="{{ decMerc }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#113C98; cursor:pointer;">&minus;</div>
              <span style="min-width:28px; text-align:center; font-family:'Oswald','Pretendard'; font-size:24px; font-weight:700; color:#113C98;">{{ mf.merc }}</span>
              <div onClick="{{ incMerc }}" style="width:44px; height:44px; border-radius:12px; border:1.5px solid #113C98; background:#113C98; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#FFFFFF; cursor:pointer;">+</div>
            </div>
          </div>
        </div>

        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span style="font-size:15px; font-weight:800;">출전 선수</span>
            <span style="font-family:'Oswald','Pretendard'; font-size:18px; font-weight:700; color:#113C98;">{{ mf.lineupCount }}<span style="font-family:'Pretendard'; font-size:13px; font-weight:700;">명</span></span>
          </div>
          <sc-if value="{{ mf.hasPre }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:13px; font-weight:600; color:#15803D; background:#E4F5EA; border-radius:10px; padding:9px 12px;">{{ mf.preNote }}</div>
          </sc-if>
          <input value="{{ q }}" onInput="{{ onQ }}" data-search="lineup" placeholder="이름 또는 초성 검색 (예: ㅇㅈㅎ)" style="width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; outline:none;" style-focus="border-color:#113C98;">
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:6px;">
            <sc-for list="{{ lineupChips }}" as="p" hint-placeholder-count="12">
              <div data-nm="{{ p.name }}" onClick="{{ p.onClick }}" style="min-height:44px; display:{{ p.disp }}; align-items:center; gap:6px; padding:0 10px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:{{ p.weight }}; background:{{ p.bg }}; color:{{ p.fg }}; border:1.5px solid {{ p.bd }};">
                <span style="font-family:'Oswald','Pretendard'; font-size:12px; font-weight:600; min-width:16px; color:{{ p.numFg }};">{{ p.num }}</span>{{ p.name }}
              </div>
            </sc-for>
          </div>
          <div id="lineupNoHit" style="display:{{ noLineupHitDisp }}; font-size:13px; color:#8A8577; text-align:center; padding:8px 0;">검색 결과가 없어요</div>
        </div>

        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span style="font-size:15px; font-weight:800;">득점자</span>
            <span style="font-size:13px; font-weight:700; color:{{ mf.sumColor }};">{{ mf.sumLabel }}</span>
          </div>
          <sc-for list="{{ goalRows }}" as="g" hint-placeholder-count="2">
            <div style="display:grid; grid-template-columns:minmax(0,1fr) auto 40px; gap:8px; align-items:center;">
              <select value="{{ g.pid }}" onChange="{{ g.onPick }}" style="width:100%; min-height:46px; padding:0 12px; border-radius:12px; border:1.5px solid {{ g.bd }}; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;">
                <sc-for list="{{ goalOpts }}" as="o" hint-placeholder-count="6">
                  <option value="{{ o.v }}">{{ o.l }}</option>
                </sc-for>
              </select>
              <div style="display:flex; align-items:center; gap:4px;">
                <div onClick="{{ g.dec }}" style="width:40px; height:44px; border-radius:10px; border:1.5px solid #E7E4DB; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#113C98; cursor:pointer;">&minus;</div>
                <span style="min-width:34px; text-align:center; font-size:14px; font-weight:800;">{{ g.n }}골</span>
                <div onClick="{{ g.inc }}" style="width:40px; height:44px; border-radius:10px; border:1.5px solid #E7E4DB; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#113C98; cursor:pointer;">+</div>
              </div>
              <div onClick="{{ g.remove }}" aria-label="삭제" style="width:40px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#8A8577; cursor:pointer;">&times;</div>
            </div>
          </sc-for>
          <div onClick="{{ addGoal }}" style="min-height:46px; display:flex; align-items:center; justify-content:center; border-radius:12px; border:1.5px dashed #C9C4B5; font-size:14px; font-weight:800; color:#113C98; cursor:pointer;">+ 득점 추가</div>
        </div>

        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span style="font-size:15px; font-weight:800;">MVP</span>
            <span style="font-size:12.5px; color:#6B675C;">출전 선수 중 1명 · 선택 사항</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            <sc-for list="{{ mvpChips }}" as="p" hint-placeholder-count="8">
              <div onClick="{{ p.onClick }}" style="min-height:40px; display:flex; align-items:center; gap:5px; padding:0 13px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:700; background:{{ p.bg }}; color:{{ p.fg }}; border:1.5px solid {{ p.bd }};">{{ p.mark }}{{ p.name }}</div>
            </sc-for>
          </div>
          <sc-if value="{{ mvpEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:13px; color:#8A8577;">출전 선수를 먼저 선택해주세요.</div>
          </sc-if>
        </div>
        <sc-if value="{{ mf.canDelete }}" hint-placeholder-val="{{ true }}"><div onClick="{{ deleteMatch }}" style="min-height:46px; display:flex; align-items:center; justify-content:center; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; font-size:14px; font-weight:800; color:#C0392B; cursor:pointer; margin-top:6px;">이 경기 기록 삭제</div></sc-if>
        <sc-if value="{{ mf.canCancel }}" hint-placeholder-val="{{ false }}"><div onClick="{{ cancelSchedule }}" style="min-height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; cursor:pointer; margin-top:6px; padding:8px 12px;"><span style="font-size:14px; font-weight:800; color:#C0392B;">경기 안 함 (일정 삭제)</span><span style="font-size:12px; color:#8A8577;">취소된 경기면 일정을 지워 목록에서 없애요</span></div></sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ vSchedule }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="일정 입력" style="display:flex; flex-direction:column; gap:10px;">
        <div onClick="{{ back }}" style="align-self:flex-start; min-height:40px; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:800; color:#113C98; cursor:pointer;"><span style="font-size:20px;">‹</span>경기 목록</div>
        <div style="font-size:20px; font-weight:800; padding-bottom:8px; border-bottom:2px solid #113C98;">{{ sf.title }}</div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px;">
          <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;">
            <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">날짜<input type="date" value="{{ sf.date }}" onChange="{{ sf.onDate }}" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid {{ sf.dateBd }}; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;"></label>
            <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">시간<input type="time" value="{{ sf.time }}" onChange="{{ sf.onTime }}" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;"></label>
          </div>
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">상대팀<input value="{{ sf.opp }}" onChange="{{ sf.onOpp }}" placeholder="예: FC 챌린지" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid {{ sf.oppBd }}; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">구장<input value="{{ sf.venue }}" onChange="{{ sf.onVenue }}" placeholder="예: 은로초등학교" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">주소<input value="{{ sf.address }}" onChange="{{ sf.onAddress }}" placeholder="예: 서울 노원구 동일로 1234" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none;" style-focus="border-color:#113C98;"></label>
          <div id="schedMap" data-address="{{ sf.address }}" data-venue="{{ sf.venue }}" style="height:170px; border-radius:10px; overflow:hidden; background:{{ sf.mapBg }}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:16px; text-align:center;">
            <sc-if value="{{ sf.hasMap }}" hint-placeholder-val="{{ true }}">
              <div style="width:16px; height:16px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:#F0D281; border:3px solid #FFFFFF;"></div>
              <div style="font-size:13.5px; font-weight:800; color:#FFFFFF;">{{ sf.venueOrAddr }}</div>
              <div style="font-size:12px; color:#9FB4E4;">지도에서 위치를 찾고 있어요</div>
            </sc-if>
            <sc-if value="{{ sf.noMap }}" hint-placeholder-val="{{ false }}">
              <div style="font-size:13px; font-weight:600; color:#8A8577;">주소를 입력하면 지도에 위치가 표시돼요</div>
            </sc-if>
          </div>
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">공지 메모<textarea rows="3" value="{{ sf.note }}" onChange="{{ sf.onNote }}" placeholder="주차 안내, 준비물 등" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; color:#1A1A1A; outline:none; resize:vertical; line-height:1.5;" style-focus="border-color:#113C98;"></textarea></label>
        </div>
        <sc-if value="{{ sf.isEdit }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ deleteSchedule }}" style="min-height:46px; display:flex; align-items:center; justify-content:center; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; font-size:14px; font-weight:800; color:#C0392B; cursor:pointer;">이 일정 삭제</div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ vPlayers }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="선수" style="display:flex; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">
          <span style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700;">선수 관리 <span style="font-family:'Pretendard'; font-size:13px; font-weight:700; color:#6B675C;">{{ playerSummary }}</span></span>
          <div onClick="{{ openSheet }}" style="min-height:36px; padding:0 14px; display:flex; align-items:center; border-radius:18px; background:#113C98; color:#FFFFFF; font-size:13px; font-weight:800; cursor:pointer;">+ 선수 추가</div>
        </div>
        <input value="{{ pq }}" onInput="{{ onPq }}" data-search="players" placeholder="이름 또는 초성 검색" style="width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid #E7E4DB; background:#FFFFFF; font-size:16px; outline:none; margin-bottom:10px;" style-focus="border-color:#113C98;">
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden;">
          <div style="display:grid; grid-template-columns:52px minmax(0,1fr) 64px 64px; align-items:center; gap:8px; padding:10px 12px; background:#F6F5F1;">
            <span style="font-size:12px; font-weight:800; color:#6B675C;">번호</span>
            <span style="font-size:12px; font-weight:800; color:#6B675C;">이름</span>
            <span style="font-size:12px; font-weight:800; color:#6B675C; text-align:center;">활성</span>
            <span style="font-size:12px; font-weight:800; color:#6B675C; text-align:center;">용병 담당</span>
          </div>
          <sc-for list="{{ playerRows }}" as="r" hint-placeholder-count="10">
            <div data-pnm="{{ r.name }}" style="display:{{ r.disp }}; grid-template-columns:52px minmax(0,1fr) 64px 64px; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid #F0EEE7; background:{{ r.rowBg }};">
              <input value="{{ r.num }}" inputmode="numeric" onChange="{{ r.onNum }}" onBlur="{{ r.onBlur }}" style="width:100%; padding:9px 4px; border-radius:10px; border:1.5px solid #E7E4DB; background:#FFFFFF; font-family:'Oswald','Pretendard'; font-size:16px; font-weight:600; color:#113C98; text-align:center; outline:none;" style-focus="border-color:#113C98;">
              <div style="min-width:0;">
                <input value="{{ r.name }}" onChange="{{ r.onName }}" onBlur="{{ r.onBlur }}" style="width:100%; padding:9px 8px; border-radius:10px; border:1.5px solid transparent; background:transparent; font-size:16px; font-weight:700; color:{{ r.nameColor }}; outline:none;" style-focus="border-color:#113C98; background:#FFFFFF;">
                <sc-if value="{{ r.hasMsg }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:12px; font-weight:800; color:{{ r.msgColor }}; padding:0 8px 2px;">{{ r.msg }}</div>
                </sc-if>
              </div>
              <div onClick="{{ r.onActive }}" role="switch" style="display:flex; justify-content:center; padding:7px 0; cursor:pointer;">
                <div style="width:48px; height:28px; border-radius:14px; background:{{ r.aBg }}; position:relative; transition:background .15s;">
                  <div style="position:absolute; top:3px; left:{{ r.aKnob }}; width:22px; height:22px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;"></div>
                </div>
              </div>
              <div onClick="{{ r.onMgr }}" role="switch" style="display:flex; justify-content:center; padding:7px 0; cursor:pointer;">
                <div style="width:48px; height:28px; border-radius:14px; background:{{ r.mBg }}; position:relative; transition:background .15s;">
                  <div style="position:absolute; top:3px; left:{{ r.mKnob }}; width:22px; height:22px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;"></div>
                </div>
              </div>
            </div>
          </sc-for>
          <div id="playerNoHit" style="display:{{ noPlayerHitDisp }}; font-size:13px; color:#8A8577; text-align:center; padding:20px 0; border-top:1px solid #F0EEE7;">검색 결과가 없어요</div>
          
        </div>
        <div style="font-size:12.5px; color:#6B675C; margin-top:10px; line-height:1.5;">스위치와 번호·이름은 바꾸는 즉시 저장돼요. 용병 담당자만 참석 투표에서 용병 인원을 추가할 수 있어요.</div>
      </div>
    </sc-if>

    <sc-if value="{{ vSettings }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="설정" style="display:flex; flex-direction:column;">
        <div style="font-family:'Oswald','Pretendard'; font-size:16px; font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #113C98;">설정</div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; overflow:hidden;">
          <div style="padding:16px 16px 12px;">
            <div style="font-size:15px; font-weight:800;">시즌 MVP 공개</div>
            <div style="font-size:12.5px; color:#6B675C; margin-top:3px;">끄면 메인 사이트에서 해당 시즌 MVP 이름이 가려져요.</div>
          </div>
          <sc-for list="{{ seasonRows }}" as="r" hint-placeholder-count="6">
            <div onClick="{{ r.onClick }}" style="display:flex; align-items:center; gap:12px; padding:10px 16px; border-top:1px solid #F0EEE7; cursor:pointer; min-height:56px;">
              <span style="font-family:'Oswald','Pretendard'; font-size:18px; font-weight:700; color:#113C98;">{{ r.season }}</span>
              <span style="flex:1; font-size:13px; font-weight:700; color:{{ r.stColor }};">{{ r.st }}</span>
              <sc-if value="{{ r.hasMsg }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:12px; font-weight:800; color:{{ r.msgColor }};">{{ r.msg }}</span>
              </sc-if>
              <div style="width:48px; height:28px; border-radius:14px; background:{{ r.bg }}; position:relative; transition:background .15s; flex-shrink:0;">
                <div style="position:absolute; top:3px; left:{{ r.knob }}; width:22px; height:22px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;"></div>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="background:#FFFFFF; box-shadow:0 3px 12px rgba(59,52,24,.08); border-radius:14px; padding:16px; margin-top:12px; display:flex; align-items:center; gap:12px;">
          <div style="flex:1; min-width:0;">
            <div style="font-size:15px; font-weight:800;">계정</div>
            <div style="font-size:12.5px; color:#6B675C; margin-top:3px;">{{ accountLabel }}</div>
          </div>
          <div onClick="{{ logout }}" style="min-height:44px; padding:0 18px; display:flex; align-items:center; border-radius:12px; border:1.5px solid #E7E4DB; font-size:14px; font-weight:800; color:#C0392B; cursor:pointer;">로그아웃</div>
        </div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ showSaveBar }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; bottom:0; left:0; right:0; z-index:100; background:#FFFFFF; border-top:1px solid #E7E4DB; box-shadow:0 -2px 10px rgba(17,30,60,.08);">
      <div style="max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));">
        <div style="flex:1; min-width:0; display:flex; align-items:center; gap:7px;">
          <span style="width:9px; height:9px; border-radius:50%; flex-shrink:0; background:{{ sb.dot }};"></span>
          <span style="font-size:13px; font-weight:700; color:{{ sb.color }}; line-height:1.35;">{{ sb.status }}</span>
        </div>
        <div onClick="{{ save }}" style="min-height:50px; min-width:136px; padding:0 20px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:{{ sb.bg }}; color:#FFFFFF; font-size:15.5px; font-weight:800; cursor:pointer; opacity:{{ sb.opacity }}; transition:background .2s;">{{ sb.label }}</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showNav }}" hint-placeholder-val="{{ true }}">
    <div style="position:fixed; bottom:0; left:0; right:0; z-index:100; background:#FFFFFF; border-top:1px solid #E7E4DB; box-shadow:0 -2px 10px rgba(17,30,60,.08);">
      <div style="max-width:560px; margin:0 auto; display:flex;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.onClick }}" style="flex:1; text-align:center; padding:13px 4px calc(14px + env(safe-area-inset-bottom)); cursor:pointer; font-size:14px; font-weight:800; color:{{ t.color }}; border-top:3px solid {{ t.bd }};">{{ t.label }}<sc-if value="{{ t.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block; margin-left:5px; min-width:18px; padding:1px 5px; border-radius:9px; background:#C0392B; color:#FFFFFF; font-size:11px; font-weight:800; vertical-align:2px;">{{ t.badge }}</span></sc-if></div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="선수 추가" onClick="{{ closeSheet }}" style="position:fixed; inset:0; z-index:200; background:rgba(17,30,60,.45); display:flex; align-items:flex-end; justify-content:center;">
      <div onClick="{{ stop }}" style="width:100%; max-width:560px; background:#FFFFFF; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; box-shadow:0 -6px 24px rgba(17,30,60,.2);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-size:16px; font-weight:800;">선수 추가</div>
          <div onClick="{{ closeSheet }}" style="width:32px; height:32px; border-radius:50%; background:#F3F1EA; color:#6B675C; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; cursor:pointer;">&times;</div>
        </div>
        <div style="display:grid; grid-template-columns:96px minmax(0,1fr); gap:10px;">
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">등번호<input value="{{ newNum }}" onChange="{{ onNewNum }}" inputmode="numeric" placeholder="14" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; outline:none;" style-focus="border-color:#113C98;"></label>
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:#6B675C;">이름<input value="{{ newName }}" onChange="{{ onNewName }}" placeholder="예: 이정호" style="width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid #E7E4DB; background:#F6F5F1; font-size:16px; outline:none;" style-focus="border-color:#113C98;"></label>
        </div>
        <sc-if value="{{ hasSheetErr }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:13px; font-weight:700; color:#C0392B; background:#FBE9E9; border-radius:10px; padding:10px 12px;">{{ sheetErr }}</div>
        </sc-if>
        <div onClick="{{ addPlayer }}" style="min-height:50px; display:flex; align-items:center; justify-content:center; border-radius:12px; background:{{ sheetBtnBg }}; color:#FFFFFF; font-size:15px; font-weight:800; cursor:pointer; opacity:{{ sheetBtnOp }};">{{ sheetBtnLabel }}</div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<datalist id="regionOptions"></datalist>
<script src="./admin.js" defer></script>
</body>
</html>
