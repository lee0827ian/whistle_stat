# Supabase 무료 프로젝트는 약 1주일 동안 요청이 없으면 자동으로 정지된다.
# 하루 한 번 데이터를 한 줄 조회해서 정지를 막는다. 조회에 실패하면 이 작업이 실패로 표시되고 GitHub가 메일로 알린다.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 (한국 시간). GitHub 사정으로 몇 시간 늦게 돌 수 있다
  workflow_dispatch:         # Actions 탭에서 직접 실행

permissions:
  contents: read
  actions: write             # 아래 "예약 유지" 단계에 필요

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Supabase 조회
        run: |
          # 접속 주소와 공개 키는 사이트가 쓰는 값(script.js)을 그대로 읽는다
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" script.js | head -1)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" script.js | head -1)
          test -n "$URL" && test -n "$KEY"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/schedules?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" = "200"

      # GitHub는 공개 레포에 60일 동안 활동이 없으면 예약 작업을 끈다. 이 작업을 "켜짐"으로 다시 설정해 꺼지지 않게 한다.
      - name: 예약 유지
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
