# 다음카페 기록 글·다음경기 메모 → 사이트 DB. 결과는 실행 화면의 Summary에 나온다.
# 자동: 30분마다 실제 반영(write). GitHub 사정으로 몇 분~수십 분 늦게 돌 수 있다.
# 수동: Actions 탭에서 mode를 골라 실행 — preview = 비교만(DB에 쓰지 않음), write = 바뀐 것만 반영
name: Cafe sync

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = 비교만 / write = 실제 반영'
        type: choice
        options: [preview, write]
        default: preview

permissions:
  contents: read
  actions: write             # 아래 "예약 유지" 단계에 필요

concurrency:
  group: cafe-sync          # 두 번 겹쳐 돌지 않게

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_WRITE: ${{ github.event_name == 'schedule' || inputs.mode == 'write' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 카페 읽기 → DB 비교/반영
        env:
          WRITE: ${{ env.DO_WRITE == 'true' && '1' || '' }}
          WHISTLE_ADMIN_EMAIL: ${{ env.DO_WRITE == 'true' && secrets.WHISTLE_ADMIN_EMAIL || '' }}
          WHISTLE_ADMIN_PIN: ${{ env.DO_WRITE == 'true' && secrets.WHISTLE_ADMIN_PIN || '' }}
        run: node sync/cafe_sync.mjs

      # GitHub는 공개 레포에 60일 동안 활동이 없으면 예약 작업을 끈다. 이 작업을 "켜짐"으로 다시 설정해 꺼지지 않게 한다.
      - name: 예약 유지
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cafe_sync.yml/enable"
